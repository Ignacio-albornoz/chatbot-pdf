name: Code Pipeline → Build & Push Docker Image

on:
  push:
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  OPENAI_MODEL: "gpt-3.5-turbo"

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Setup Docker Buildx  # opcional, útil para multi-arch
        uses: docker/setup-buildx-action@v2

      - name: Login a GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/chatbot-pdf:latest
          docker build \
            --file Dockerfile \
            --tag "$IMAGE_NAME" \
            .

      - name: Push Docker image a GHCR
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}/chatbot-pdf:latest
          docker push "$IMAGE_NAME"

      - name: Mostrar URL de la imagen
        run: echo "Imagen publicada: ghcr.io/${{ github.repository }}/chatbot-pdf:latest"
