name: Data Pipeline → Generar y subir índice como artifact

on:
  push:
    paths:
      - 'data/raw/**'
      - 'src/pdf_loader.py'
      - 'src/rule_structurer.py'
      - 'src/embeddings.py'
      - 'src/indexer.py'
  workflow_dispatch:   # Para ejecutarlo manualmente si hace falta

env:
  PYTHON_VERSION: "3.11"
  OPENAI_MODEL: "gpt-3.5-turbo"

jobs:
  build-index:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout (con LFS)
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache de pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extraer texto de PDFs
        run: python src/pdf_loader.py

      - name: Estructurar rule-based (sin GPT)
        run: python src/rule_structurer.py

      - name: Generar embeddings
        run: python src/embeddings.py

      - name: Construir índice FAISS
        run: python src/indexer.py build

      - name: Empaquetar carpeta index/ como artifact
        uses: actions/upload-artifact@v3
        with:
          name: chatbot-index   # nombre con el que lo veremos en GitHub
          path: index/         # subcarpeta que contiene index.faiss, embeddings.npy, metadata.json

      - name: Listar contenido de index/ (para debug)
        run: ls -R index/
