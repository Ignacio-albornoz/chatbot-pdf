name: Generar índice de chatbot

on:
  push:
    paths:
      - 'data/raw/**'         # Si cambian PDFs, volver a procesar
      - 'src/**'              # Si cambia código, volver a procesar
  workflow_dispatch:         # Permite disparar manualmente desde GitHub

jobs:
  build-index:
    runs-on: ubuntu-latest
    env:
      # IMPORTANTE: define en Settings → Secrets → OPENAI_API_KEY
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: "gpt-3.5-turbo"
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache de pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extraer texto de PDFs
        run: |
          python src/pdf_loader.py

      - name: Estructurar JSON vía ChatGPT
        run: |
          python src/gpt_structurer.py

      - name: Generar embeddings
        run: |
          python src/embeddings.py

      - name: Construir índice FAISS
        run: |
          python src/indexer.py build

      - name: Verificar artefactos
        run: |
          ls index/

